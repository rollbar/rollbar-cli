# Publishes rollbar-cli to npm when a GitHub release is published, using npm
# trusted publishing (OIDC). No NPM_TOKEN is needed: the matching trusted
# publisher on npmjs.com points at this workflow file (publish.yml).

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: Check package.json version matches release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::package.json version ($VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          case "$VERSION" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish --provenance --access public --tag ${{ steps.version.outputs.dist_tag }}
