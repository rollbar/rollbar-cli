# This workflow will do a clean install of node dependencies, lint the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node == 'latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 18
            npm: ^9
          - node: 20
            npm: ^10
          - node: 22
            npm: ^10
          - node: 24
            npm: ^11
          - node: latest
            npm: latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Update npm
        run: npm install -g npm@${{ matrix.npm }}
      - run: node --version && npm --version
      - run: npm install
      - run: npm test
